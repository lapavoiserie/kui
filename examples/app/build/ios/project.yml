name: BatteryApp
options:
  bundleIdPrefix: com.lapavoiserie.kui
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  SWIFT_VERSION: "5.9"
targets:
  BatteryApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
        type: group
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lapavoiserie.kui.battery
      GENERATE_INFOPLIST_FILE: true
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
      INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connect to a local development server on your network."
      SWIFT_OBJC_BRIDGING_HEADER: Sources/SuiBridging.h
      LIBRARY_SEARCH_PATHS:
        - "$(PROJECT_DIR)/lib"
      OTHER_LDFLAGS:
        - "-lhaxe"
        - "-lc++"
        - "-framework"
        - "UIKit"
    dependencies: []
